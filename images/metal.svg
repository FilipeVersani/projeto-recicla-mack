<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="can1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9CA3AF"/>
      <stop offset="20%" style="stop-color:#E5E7EB"/>
      <stop offset="50%" style="stop-color:#F9FAFB"/>
      <stop offset="80%" style="stop-color:#E5E7EB"/>
      <stop offset="100%" style="stop-color:#9CA3AF"/>
    </linearGradient>
    <linearGradient id="can2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B45309"/>
      <stop offset="20%" style="stop-color:#F59E0B"/>
      <stop offset="50%" style="stop-color:#FDE68A"/>
      <stop offset="80%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <linearGradient id="can3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8"/>
      <stop offset="20%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#93C5FD"/>
      <stop offset="80%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="16" fill="url(#bgMetal)"/>

  <!-- Shadow -->
  <ellipse cx="160" cy="192" rx="110" ry="9" fill="rgba(0,0,0,0.08)"/>

  <!-- Can 1 — Silver/Aluminum -->
  <g transform="translate(55,65)">
    <!-- Top ellipse -->
    <ellipse cx="28" cy="4" rx="24" ry="6" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
    <!-- Body -->
    <rect x="4" y="4" width="48" height="108" fill="url(#can1)" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- Bottom ellipse -->
    <ellipse cx="28" cy="112" rx="24" ry="6" fill="#9CA3AF"/>
    <!-- Tab on top -->
    <rect x="22" y="-2" width="12" height="5" rx="2" fill="#6B7280"/>
    <rect x="18" y="-5" width="8" height="4" rx="1.5" fill="#4B5563"/>
    <!-- Label area -->
    <rect x="6" y="28" width="44" height="60" fill="white" opacity=".15"/>
    <text x="28" y="62" font-family="Arial" font-size="20" text-anchor="middle" fill="#4B5563" opacity=".7">♻</text>
    <!-- Shine -->
    <line x1="10" y1="10" x2="10" y2="108" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".4"/>
  </g>

  <!-- Can 2 — Gold/Conserve -->
  <g transform="translate(132,45)">
    <ellipse cx="28" cy="4" rx="24" ry="6" fill="#D97706" stroke="#B45309" stroke-width="1"/>
    <rect x="4" y="4" width="48" height="128" fill="url(#can2)" stroke="#B45309" stroke-width="1.5"/>
    <ellipse cx="28" cy="132" rx="24" ry="6" fill="#92400E"/>
    <!-- Label -->
    <rect x="6" y="35" width="44" height="60" rx="2" fill="white" opacity=".25"/>
    <text x="28" y="70" font-family="Arial" font-size="20" text-anchor="middle" fill="#78350F" opacity=".8">♻</text>
    <line x1="10" y1="10" x2="10" y2="126" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- Can 3 — Blue -->
  <g transform="translate(210,70)">
    <ellipse cx="28" cy="4" rx="24" ry="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1"/>
    <rect x="4" y="4" width="48" height="100" fill="url(#can3)" stroke="#1D4ED8" stroke-width="1.5"/>
    <ellipse cx="28" cy="104" rx="24" ry="6" fill="#1D4ED8"/>
    <rect x="22" y="-2" width="12" height="5" rx="2" fill="#1E40AF"/>
    <rect x="18" y="-5" width="8" height="4" rx="1.5" fill="#1E3A8A"/>
    <rect x="6" y="22" width="44" height="55" fill="white" opacity=".15"/>
    <text x="28" y="53" font-family="Arial" font-size="20" text-anchor="middle" fill="#DBEAFE" opacity=".9">♻</text>
    <line x1="10" y1="10" x2="10" y2="100" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".4"/>
  </g>

  <!-- Yellow ribbon -->
  <rect x="55" y="10" width="82" height="22" rx="11" fill="#D97706"/>
  <text x="96" y="25" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">LINHA AMARELA</text>

  <!-- Label -->
  <rect x="90" y="187" width="140" height="26" rx="8" fill="rgba(255,255,255,0.7)"/>
  <text x="160" y="204" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400E">🥫 Metal</text>
</svg>
