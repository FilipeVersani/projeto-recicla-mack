<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D1FAE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A7F3D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#065F46"/>
      <stop offset="25%" style="stop-color:#059669"/>
      <stop offset="50%" style="stop-color:#34D399"/>
      <stop offset="75%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#065F46"/>
    </linearGradient>
    <linearGradient id="clearBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93C5FD" stop-opacity=".5"/>
      <stop offset="35%" style="stop-color:#EFF6FF" stop-opacity=".9"/>
      <stop offset="65%" style="stop-color:#DBEAFE" stop-opacity=".8"/>
      <stop offset="100%" style="stop-color:#93C5FD" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="brownBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#78350F"/>
      <stop offset="25%" style="stop-color:#B45309"/>
      <stop offset="50%" style="stop-color:#D97706"/>
      <stop offset="75%" style="stop-color:#B45309"/>
      <stop offset="100%" style="stop-color:#78350F"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="16" fill="url(#bgGlass)"/>
  <ellipse cx="160" cy="192" rx="115" ry="8" fill="rgba(0,0,0,0.07)"/>

  <!-- Glass jar/pot -->
  <g transform="translate(55, 75)">
    <!-- Lid -->
    <ellipse cx="36" cy="6" rx="30" ry="7" fill="#6B7280" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="6" y="2" width="60" height="8" fill="#9CA3AF" rx="2"/>
    <!-- Body -->
    <path d="M10,12 Q6,14 6,22 L6,108 Q6,116 36,116 Q66,116 66,108 L66,22 Q66,14 62,12 Z" fill="url(#clearBottle)" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Bottom -->
    <ellipse cx="36" cy="112" rx="30" ry="7" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
    <!-- Content lines (water/contents) -->
    <path d="M8,65 Q20,62 36,65 Q52,68 64,65 L64,108 Q64,115 36,115 Q8,115 8,108 Z" fill="#BBF7D0" opacity=".6"/>
    <!-- Shine -->
    <line x1="13" y1="18" x2="13" y2="105" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <line x1="20" y1="16" x2="20" y2="60" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
    <!-- Recycle -->
    <text x="36" y="55" font-family="Arial" font-size="18" text-anchor="middle" fill="#065F46" opacity=".5">♻</text>
  </g>

  <!-- Green wine bottle -->
  <g transform="translate(148, 35)">
    <!-- Neck top cap -->
    <rect x="19" y="0" width="18" height="10" rx="4" fill="#064E3B"/>
    <!-- Neck -->
    <rect x="22" y="8" width="12" height="30" fill="url(#greenBottle)" stroke="#065F46" stroke-width="1"/>
    <!-- Shoulder -->
    <path d="M22,36 Q16,42 14,52 L14,62 L42,62 L42,52 Q40,42 34,36 Z" fill="url(#greenBottle)" stroke="#065F46" stroke-width="1.5"/>
    <!-- Body -->
    <rect x="14" y="60" width="28" height="118" rx="4" fill="url(#greenBottle)" stroke="#065F46" stroke-width="1.5"/>
    <!-- Bottom -->
    <ellipse cx="28" cy="178" rx="14" ry="4" fill="#064E3B"/>
    <!-- Label -->
    <rect x="16" y="88" width="24" height="52" rx="3" fill="white" opacity=".18"/>
    <text x="28" y="118" font-family="Arial" font-size="14" text-anchor="middle" fill="#D1FAE5" opacity=".8">♻</text>
    <!-- Shine -->
    <line x1="18" y1="60" x2="18" y2="172" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>
  </g>

  <!-- Brown bottle -->
  <g transform="translate(225, 58)">
    <rect x="19" y="0" width="18" height="10" rx="4" fill="#78350F"/>
    <rect x="22" y="8" width="12" height="25" fill="url(#brownBottle)" stroke="#78350F" stroke-width="1"/>
    <path d="M22,31 Q16,36 14,46 L14,56 L42,56 L42,46 Q40,36 34,31 Z" fill="url(#brownBottle)" stroke="#78350F" stroke-width="1.5"/>
    <rect x="14" y="54" width="28" height="108" rx="4" fill="url(#brownBottle)" stroke="#78350F" stroke-width="1.5"/>
    <ellipse cx="28" cy="162" rx="14" ry="4" fill="#78350F"/>
    <rect x="16" y="75" width="24" height="45" rx="3" fill="white" opacity=".15"/>
    <text x="28" y="101" font-family="Arial" font-size="14" text-anchor="middle" fill="#FDE68A" opacity=".8">♻</text>
    <line x1="18" y1="54" x2="18" y2="158" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".25"/>
  </g>

  <!-- Green ribbon -->
  <rect x="55" y="10" width="74" height="22" rx="11" fill="#065F46"/>
  <text x="92" y="25" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">LINHA VERDE</text>

  <!-- Label -->
  <rect x="90" y="187" width="140" height="26" rx="8" fill="rgba(255,255,255,0.7)"/>
  <text x="160" y="204" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#065F46">🍾 Vidro</text>
</svg>
