<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF4"/>
      <stop offset="100%" style="stop-color:#DCFCE7"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#15803D"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="200" r="185" fill="url(#heroBg)"/>
  <circle cx="250" cy="200" r="185" fill="none" stroke="#86EFAC" stroke-width="2" stroke-dasharray="12 8"/>

  <!-- Earth globe -->
  <circle cx="250" cy="200" r="100" fill="url(#oceanGrad)"/>
  <!-- Continents (simplified) -->
  <path d="M200,145 Q215,138 230,142 Q245,140 252,150 Q260,158 255,170 Q248,180 235,178 Q220,175 210,168 Q198,158 200,145 Z" fill="url(#earthGrad)" opacity=".9"/>
  <path d="M270,165 Q280,160 292,163 Q300,168 298,178 Q295,186 285,186 Q274,184 270,175 Z" fill="url(#earthGrad)" opacity=".9"/>
  <path d="M195,190 Q210,185 222,192 Q228,200 224,212 Q216,220 205,218 Q196,212 195,200 Z" fill="url(#earthGrad)" opacity=".9"/>
  <path d="M248,218 Q265,215 278,220 Q288,228 285,240 Q278,250 265,248 Q252,245 248,232 Z" fill="url(#earthGrad)" opacity=".9"/>
  <path d="M220,240 Q232,237 238,244 Q240,252 234,256 Q226,258 220,252 Z" fill="url(#earthGrad)" opacity=".9"/>
  <!-- Globe shine -->
  <ellipse cx="225" cy="172" rx="18" ry="12" fill="white" opacity=".15" transform="rotate(-20, 225, 172)"/>

  <!-- Large recycle arrows around earth -->
  <!-- Arrow 1 — Top right arc -->
  <path d="M328,155 A90,90 0 0,1 310,272" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round"/>
  <polygon points="316,147 338,160 325,172" fill="#22C55E"/>

  <!-- Arrow 2 — Bottom arc -->
  <path d="M310,272 A90,90 0 0,1 190,272" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <polygon points="196,280 186,258 204,258" fill="#16A34A"/>

  <!-- Arrow 3 — Left arc -->
  <path d="M190,272 A90,90 0 0,1 328,155" fill="none" stroke="#4ADE80" stroke-width="12" stroke-linecap="round"/>
  <polygon points="320,147 342,152 332,168" fill="#4ADE80"/>

  <!-- Floating items around -->
  <!-- Paper -->
  <g transform="translate(50,60)">
    <rect x="0" y="0" width="44" height="54" rx="4" fill="white" stroke="#93C5FD" stroke-width="2"/>
    <line x1="6" y1="14" x2="38" y2="14" stroke="#BFDBFE" stroke-width="2"/>
    <line x1="6" y1="22" x2="38" y2="22" stroke="#BFDBFE" stroke-width="2"/>
    <line x1="6" y1="30" x2="28" y2="30" stroke="#BFDBFE" stroke-width="2"/>
    <text x="22" y="48" font-family="Arial" font-size="12" text-anchor="middle" fill="#3B82F6">📄</text>
  </g>

  <!-- Plastic bottle -->
  <g transform="translate(400,55)">
    <rect x="14" y="0" width="14" height="8" rx="3" fill="#EF4444"/>
    <path d="M10,8 Q6,12 6,18 L6,68 Q6,74 20,74 Q34,74 34,68 L34,18 Q34,12 30,8 Z" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="20" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#EF4444">♻</text>
  </g>

  <!-- Can -->
  <g transform="translate(60,290)">
    <ellipse cx="22" cy="4" rx="18" ry="5" fill="#D97706"/>
    <rect x="4" y="4" width="36" height="58" fill="#FEF9C3" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="22" cy="62" rx="18" ry="5" fill="#B45309"/>
    <text x="22" y="36" font-family="Arial" font-size="14" text-anchor="middle" fill="#B45309">♻</text>
  </g>

  <!-- Glass bottle -->
  <g transform="translate(400,280)">
    <rect x="16" y="0" width="10" height="20" rx="3" fill="#065F46"/>
    <path d="M16,18 Q10,22 10,28 L10,88 Q10,96 21,96 Q32,96 32,88 L32,28 Q32,22 26,18 Z" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="21" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#065F46">♻</text>
  </g>

  <!-- Electronics chip -->
  <g transform="translate(440,170)">
    <rect x="0" y="0" width="38" height="32" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
    <rect x="5" y="5" width="28" height="22" rx="2" fill="#065F46" opacity=".7"/>
    <rect x="-5" y="5" width="5" height="3" fill="#9CA3AF" rx="1"/>
    <rect x="-5" y="12" width="5" height="3" fill="#9CA3AF" rx="1"/>
    <rect x="-5" y="19" width="5" height="3" fill="#9CA3AF" rx="1"/>
    <rect x="38" y="5" width="5" height="3" fill="#9CA3AF" rx="1"/>
    <rect x="38" y="12" width="5" height="3" fill="#9CA3AF" rx="1"/>
    <rect x="38" y="19" width="5" height="3" fill="#9CA3AF" rx="1"/>
    <text x="19" y="21" font-family="Arial" font-size="10" text-anchor="middle" fill="#34D399">IC</text>
  </g>

  <!-- Center text -->
  <text x="250" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#15803D">♻ Recicle. Preserve. Impacte.</text>
</svg>
