<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEE2E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FECACA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCA5A5"/>
      <stop offset="40%" style="stop-color:#FEF2F2"/>
      <stop offset="100%" style="stop-color:#FCA5A5"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="40%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#93C5FD"/>
    </linearGradient>
    <linearGradient id="bottle3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6EE7B7"/>
      <stop offset="40%" style="stop-color:#F0FDF4"/>
      <stop offset="100%" style="stop-color:#6EE7B7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="320" height="220" rx="16" fill="url(#bgPlastic)"/>

  <!-- Shadow under bottles -->
  <ellipse cx="160" cy="190" rx="100" ry="10" fill="rgba(0,0,0,0.08)"/>

  <!-- Bottle 1 — Red/Transparent -->
  <g transform="translate(60,50)">
    <!-- Cap -->
    <rect x="17" y="0" width="22" height="12" rx="4" fill="#EF4444"/>
    <!-- Neck -->
    <rect x="20" y="10" width="16" height="18" rx="3" fill="url(#bottle1)" stroke="#FCA5A5" stroke-width="1"/>
    <!-- Body -->
    <path d="M14 28 Q8 32 8 42 L8 120 Q8 128 20 128 L36 128 Q48 128 48 120 L48 42 Q48 32 42 28 Z" fill="url(#bottle1)" stroke="#FCA5A5" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="12" y="60" width="32" height="40" rx="4" fill="white" opacity=".7"/>
    <text x="28" y="84" font-family="Arial" font-size="16" text-anchor="middle" fill="#EF4444">♻</text>
    <!-- Highlight -->
    <line x1="16" y1="40" x2="16" y2="110" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- Bottle 2 — Blue/Water -->
  <g transform="translate(125,30)">
    <rect x="17" y="0" width="22" height="12" rx="4" fill="#3B82F6"/>
    <rect x="20" y="10" width="16" height="18" rx="3" fill="url(#bottle2)" stroke="#93C5FD" stroke-width="1"/>
    <path d="M14 28 Q8 32 8 42 L8 140 Q8 148 20 148 L36 148 Q48 148 48 140 L48 42 Q48 32 42 28 Z" fill="url(#bottle2)" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="12" y="70" width="32" height="45" rx="4" fill="white" opacity=".7"/>
    <text x="28" y="97" font-family="Arial" font-size="16" text-anchor="middle" fill="#3B82F6">♻</text>
    <line x1="16" y1="40" x2="16" y2="130" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- Bottle 3 — Green -->
  <g transform="translate(195,55)">
    <rect x="17" y="0" width="22" height="12" rx="4" fill="#10B981"/>
    <rect x="20" y="10" width="16" height="18" rx="3" fill="url(#bottle3)" stroke="#6EE7B7" stroke-width="1"/>
    <path d="M14 28 Q8 32 8 42 L8 115 Q8 123 20 123 L36 123 Q48 123 48 115 L48 42 Q48 32 42 28 Z" fill="url(#bottle3)" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="12" y="58" width="32" height="38" rx="4" fill="white" opacity=".7"/>
    <text x="28" y="81" font-family="Arial" font-size="16" text-anchor="middle" fill="#10B981">♻</text>
    <line x1="16" y1="40" x2="16" y2="108" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- Red ribbon -->
  <rect x="60" y="9" width="80" height="22" rx="11" fill="#DC2626"/>
  <text x="100" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">LINHA VERMELHA</text>

  <!-- Label -->
  <rect x="70" y="186" width="180" height="26" rx="8" fill="rgba(255,255,255,0.7)"/>
  <text x="160" y="203" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#B91C1C">🥤 Plástico</text>
</svg>
