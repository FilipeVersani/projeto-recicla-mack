<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgElec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EDE9FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDD6FE;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="16" fill="url(#bgElec)"/>

  <!-- Laptop -->
  <g transform="translate(30, 55)">
    <!-- Screen -->
    <rect x="0" y="0" width="110" height="75" rx="6" fill="#1F2937" stroke="#374151" stroke-width="2"/>
    <rect x="4" y="4" width="102" height="67" rx="4" fill="#1E3A5F"/>
    <!-- Screen content - circuit board pattern -->
    <line x1="10" y1="20" x2="30" y2="20" stroke="#3B82F6" stroke-width="1" opacity=".6"/>
    <line x1="30" y1="20" x2="30" y2="35" stroke="#3B82F6" stroke-width="1" opacity=".6"/>
    <line x1="30" y1="35" x2="50" y2="35" stroke="#3B82F6" stroke-width="1" opacity=".6"/>
    <circle cx="50" cy="35" r="3" fill="#60A5FA" opacity=".8"/>
    <line x1="50" y1="35" x2="50" y2="20" stroke="#3B82F6" stroke-width="1" opacity=".6"/>
    <line x1="50" y1="20" x2="90" y2="20" stroke="#3B82F6" stroke-width="1" opacity=".6"/>
    <line x1="70" y1="35" x2="95" y2="35" stroke="#60A5FA" stroke-width="1" opacity=".6"/>
    <line x1="70" y1="35" x2="70" y2="55" stroke="#60A5FA" stroke-width="1" opacity=".6"/>
    <circle cx="70" cy="55" r="3" fill="#818CF8" opacity=".8"/>
    <line x1="35" y1="50" x2="65" y2="50" stroke="#A78BFA" stroke-width="1" opacity=".6"/>
    <circle cx="35" cy="50" r="2.5" fill="#C4B5FD" opacity=".8"/>
    <!-- Recycle icon on screen -->
    <text x="55" y="68" font-family="Arial" font-size="22" text-anchor="middle" fill="#60A5FA" opacity=".9">♻</text>
    <!-- Camera dot -->
    <circle cx="55" cy="7" r="2" fill="#374151"/>
    <!-- Base/keyboard -->
    <rect x="0" y="77" width="110" height="8" rx="2" fill="#374151" stroke="#4B5563" stroke-width="1"/>
    <!-- Keyboard lines -->
    <rect x="8" y="79" width="94" height="4" rx="1" fill="#4B5563" opacity=".5"/>
  </g>

  <!-- Smartphone -->
  <g transform="translate(175, 50)">
    <rect x="0" y="0" width="52" height="95" rx="10" fill="#111827" stroke="#374151" stroke-width="2"/>
    <rect x="3" y="8" width="46" height="75" rx="4" fill="#1E3A5F"/>
    <!-- Screen icons -->
    <circle cx="12" cy="22" r="6" fill="#3B82F6" opacity=".7"/>
    <circle cx="26" cy="22" r="6" fill="#10B981" opacity=".7"/>
    <circle cx="40" cy="22" r="6" fill="#F59E0B" opacity=".7"/>
    <circle cx="12" cy="38" r="6" fill="#EF4444" opacity=".7"/>
    <circle cx="26" cy="38" r="6" fill="#8B5CF6" opacity=".7"/>
    <circle cx="40" cy="38" r="6" fill="#06B6D4" opacity=".7"/>
    <!-- Recycle -->
    <text x="26" y="66" font-family="Arial" font-size="18" text-anchor="middle" fill="#60A5FA" opacity=".9">♻</text>
    <!-- Home button area -->
    <circle cx="26" cy="88" r="4" fill="#374151"/>
    <!-- Notch/speaker -->
    <rect x="18" y="2" width="16" height="4" rx="2" fill="#374151"/>
  </g>

  <!-- Battery / Pills -->
  <g transform="translate(240, 80)">
    <!-- Battery body -->
    <rect x="0" y="0" width="56" height="30" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="56" y="8" width="8" height="14" rx="3" fill="#4B5563"/>
    <!-- Battery levels -->
    <rect x="4" y="4" width="12" height="22" rx="3" fill="#EF4444"/>
    <rect x="19" y="4" width="12" height="22" rx="3" fill="#F59E0B"/>
    <rect x="34" y="4" width="12" height="22" rx="3" fill="#374151"/>
    <!-- Warning exclamation -->
    <text x="28" y="22" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#EF4444" opacity=".0">!</text>
  </g>

  <!-- Small circuit board chip -->
  <g transform="translate(248, 125)">
    <rect x="0" y="0" width="50" height="40" rx="4" fill="#064E3B" stroke="#065F46" stroke-width="1.5"/>
    <!-- Pins left -->
    <rect x="-6" y="6" width="6" height="4" fill="#9CA3AF"/>
    <rect x="-6" y="14" width="6" height="4" fill="#9CA3AF"/>
    <rect x="-6" y="22" width="6" height="4" fill="#9CA3AF"/>
    <rect x="-6" y="30" width="6" height="4" fill="#9CA3AF"/>
    <!-- Pins right -->
    <rect x="50" y="6" width="6" height="4" fill="#9CA3AF"/>
    <rect x="50" y="14" width="6" height="4" fill="#9CA3AF"/>
    <rect x="50" y="22" width="6" height="4" fill="#9CA3AF"/>
    <rect x="50" y="30" width="6" height="4" fill="#9CA3AF"/>
    <!-- Pins top -->
    <rect x="8" y="-6" width="4" height="6" fill="#9CA3AF"/>
    <rect x="20" y="-6" width="4" height="6" fill="#9CA3AF"/>
    <rect x="32" y="-6" width="4" height="6" fill="#9CA3AF"/>
    <!-- IC square -->
    <rect x="12" y="8" width="26" height="24" rx="3" fill="#10B981" opacity=".5"/>
    <text x="25" y="24" font-family="Arial" font-size="12" text-anchor="middle" fill="#D1FAE5">IC</text>
  </g>

  <!-- Warning label -->
  <g transform="translate(30, 155)">
    <rect x="0" y="0" width="135" height="28" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="10" y="19" font-family="Arial, sans-serif" font-size="12" fill="#92400E">⚠️ Descarte especial</text>
  </g>

  <!-- Purple ribbon -->
  <rect x="30" y="10" width="96" height="22" rx="11" fill="#7C3AED"/>
  <text x="78" y="25" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">REEE / ESPECIAL</text>

  <!-- Label -->
  <rect x="75" y="188" width="170" height="26" rx="8" fill="rgba(255,255,255,0.7)"/>
  <text x="160" y="205" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#5B21B6">💻 Eletrônicos</text>
</svg>
